# 로컬에서 이 브랜치를 띄워 보기 위한 구성.
#
#   docker compose -f local-test.yml up --build
#   http://localhost:8082
#
# single-host-deployment.yml 과 다른 점:
#  - scope-sentry 이미지를 Docker Hub 에서 받지 않고 dockerfile.local 로 직접
#    빌드한다. 업스트림 이미지에는 이 브랜치의 변경이 들어 있지 않다.
#  - 스캐너는 업스트림 이미지를 그대로 쓴다. 이 브랜치는 서버와 화면만 바꿨다.
#  - 업스트림과 달리 스캐너를 host 네트워크가 아니라 같은 bridge 네트워크에 둔다.
#    network_mode: host 는 Docker Desktop(macOS/Windows)에서 제대로 동작하지
#    않아서다. 대신 raw 소켓이 필요한 플러그인을 위해 NET_RAW/NET_ADMIN 을 준다.
#    Linux 에서 포트 스캔 성능이 아쉬우면 single-host-deployment.yml 처럼
#    network_mode: host 로 바꾸고 MONGODB_IP/REDIS_IP 를 127.0.0.1 로 두면서
#    mongodb/redis 에 ports 를 열어 주면 된다.
#  - 시간대를 Asia/Seoul 로 둔다.
#
# 로컬 테스트 계정: admin / admin. 기존 admin 계정의 비밀번호는 바꾸지 않는다.

networks:
  scopesentry-local:
    name: scopesentry-local
    driver: bridge

services:
  mongodb:
    image: mongo:7.0.28
    container_name: scopesentry-mongodb-local
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - ./data-local/mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - scopesentry-local

  redis:
    image: redis:7.0.11
    container_name: scopesentry-redis-local
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./data-local/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scopesentry-local

  scope-sentry:
    build:
      context: .
      dockerfile: dockerfile.local
    image: scopesentry:local
    container_name: scope-sentry-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      SCOPE_SENTRY_LOCAL_DEFAULT_ADMIN: "true"
      TIMEZONE: Asia/Seoul
      MONGODB_IP: scopesentry-mongodb-local
      MONGODB_PORT: 27017
      MONGODB_DATABASE: ScopeSentry
      MONGODB_USER: ${MONGO_INITDB_ROOT_USERNAME}
      MONGODB_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      REDIS_IP: scopesentry-redis-local
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8082 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    volumes:
      - ./data-local/files:/opt/ScopeSentry/files
      - ./data-local/images:/opt/ScopeSentry/images
      - ./data-local/uploads:/opt/ScopeSentry/uploads
    networks:
      - scopesentry-local

  scopesentry-scan:
    image: autumn27/scopesentry-scan:latest
    container_name: scopesentry-scan-local
    restart: unless-stopped
    # ksubdomain 처럼 패킷을 직접 다루는 플러그인에 필요하다.
    #
    # 알려진 제약: NET_RAW/NET_ADMIN 을 줘도 Docker Desktop(macOS/Windows)의
    # 가상 bridge 네트워크에서는 ksubdomain 이 raw 소켓으로 보낸 DNS 패킷을
    # 제대로 못 돌려받는다. 노드가 시작할 때 하는 자체 점검 호출은 내장된 5분
    # 타임아웃으로 깔끔히 끝나지만(스캔에는 영향 없음), 실제 작업의 서브도메인
    # 사전 공격 단계는 같은 문제로 20분 넘게 멈춰 있는 걸 확인했다 — 포트 스캔
    # 등 다른 모듈은 정상 동작하는데 이 단계만 막혀 asset 이 안 쌓인다.
    # ScopeSentry-Scan(별도 저장소) 안의 동작이라 여기서 고칠 수 없다. Linux
    # 호스트에서 아래처럼 network_mode: host 로 바꾸면 피할 수 있을 것이다.
    cap_add:
      - NET_RAW
      - NET_ADMIN
    ulimits:
      core:
        soft: 0
        hard: 0
    environment:
      NodeName: node-local
      TimeZoneName: Asia/Seoul
      # TimeZoneName 은 이 스캐너가 읽는지 불확실한 자체 변수고, 실제로 컨테이너의
      # 시계를 바꾸는 건 표준 TZ 뿐이었다. autumn27/scopesentry-scan 이미지는
      # /etc/localtime 이 Asia/Shanghai 로 박혀 있어서, TZ 없이는 노드가 보내는
      # 하트비트 시각이 서버(Asia/Seoul, dockerfile.local 이 /etc/localtime 을
      # 직접 바꿔 둔다)보다 1시간 뒤처져 들어왔다. 서버는 그 차이를 "300초 넘게
      # 못 받은 하트비트"로 보고 멀쩡한 노드를 계속 연결 안 됨으로 표시했다.
      TZ: Asia/Seoul
      MONGODB_IP: scopesentry-mongodb-local
      MONGODB_PORT: 27017
      MONGODB_DATABASE: ScopeSentry
      MONGODB_USER: ${MONGO_INITDB_ROOT_USERNAME}
      MONGODB_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      REDIS_IP: scopesentry-redis-local
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
      scope-sentry:
        condition: service_healthy
    networks:
      - scopesentry-local
